name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-consolidated.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-consolidated.txt
        pip install pytest pytest-cov
        
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --cov=password-ml-app --cov-report=term-missing
        
    - name: Test Flask app startup
      run: |
        cd password-ml-app
        timeout 10s python app.py &
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        echo "Health check passed!"
      
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t password-assistant:latest .
        
    - name: Test Docker container
      run: |
        docker run -d -p 5000:5000 --name test-container password-assistant:latest
        sleep 10
        curl -f http://localhost:5000/health || exit 1
        docker logs test-container
        docker stop test-container
        echo "Docker health check passed!"
        
    - name: Test API endpoint in Docker
      run: |
        docker run -d -p 5000:5000 --name test-api password-assistant:latest
        sleep 10
        response=$(curl -s -X POST http://localhost:5000/api/analyze \
          -H "Content-Type: application/json" \
          -d '{"password": "Test123!@#"}')
        echo "API Response: $response"
        echo "$response" | grep -q "predicted_strength" || exit 1
        docker stop test-api
        echo "API test passed!"

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 password-ml-app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 password-ml-app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
